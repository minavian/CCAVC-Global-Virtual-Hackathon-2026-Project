<!doctype html>

  <script>
    // Decide before the first paint whether the opening plays, so nothing flashes.
    (function () {
      var root = document.documentElement;
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      root.setAttribute('data-intro', '');
      // If the page script never starts, show the finished page instead of a blank one.
      setTimeout(function () { if (!window.__heroStarted) root.removeAttribute('data-intro'); }, 6000);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <script src="js/models.js" defer></script>
