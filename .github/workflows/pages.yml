# Publishes the site with GitHub Pages every time main changes.
# It is served at https://hackathon.minavian.com/ccavc/RFIDtechnology/
# (see "Publishing the site" in EXPLAINED.md).
name: Publish the site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a newer one waits for the one running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Always the newest main. GitHub can start runs out of order (on 2026-11-24 an older
      # commit's run started late and put old code back on the site); this way the last run
      # to finish still publishes the latest code.
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Put the site in ccavc/RFIDtechnology
        run: |
          site=_site/ccavc/RFIDtechnology
          mkdir -p "$site"
          # Every tracked file, except dot-folders, notes (.md) and hosting/.
          git ls-files -z | grep -zvE '^(\.|hosting/)|\.md$' | xargs -0 cp --parents -t "$site"
          # The domain's own root page and its "not found" page.
          cp hosting/index.html hosting/404.html _site/
          test -f "$site/index.html"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  # Its own job, so it starts only once the upload has finished. In one job the deploy
  # sometimes asked for the files before GitHub had them ("No artifacts named github-pages").
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.first.outputs.page_url || steps.second.outputs.page_url || steps.third.outputs.page_url }}ccavc/RFIDtechnology/
    steps:
      # If GitHub is slow to hand over the files, a try can fail; wait a little and try
      # again, up to three times, so a merge never needs anyone to press "Re-run".
      - id: first
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.first.outcome == 'failure'
        run: sleep 30
      - id: second
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.second.outcome == 'failure'
        run: sleep 60
      - id: third
        if: steps.second.outcome == 'failure'
        uses: actions/deploy-pages@v5
